name: DIWIS Automated IMD Weather & SQL Sync

on:
  schedule:
    # 08:45 AM IST = 03:15 UTC
    - cron: '15 3 * * *'
    # 04:45 PM IST = 11:15 UTC
    - cron: '15 11 * * *'
  # Allows manual triggering from the GitHub Actions tab anytime
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-weather:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute DIWIS Weather & SQL Synchronization
        run: |
          python scheduler.py --run-now-only

      - name: Commit and Push Updated Weather Data & Reports
        run: |
          git config user.name "DIWIS Automated Sync Bot"
          git config user.email "actions@github.com"
          git add data/ output/ output_hailakandi/
          if git diff --staged --quiet; then
            echo "No changes detected. Skipping commit."
          else
            git commit -m "Auto-sync: IMD meteorological intelligence update [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git push
          fi
