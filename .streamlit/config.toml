[server]
headless = true
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 10

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = false

[theme]
primaryColor = "#287A68"
backgroundColor = "#F4F7F8"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#20313B"
font = "sans serif"
